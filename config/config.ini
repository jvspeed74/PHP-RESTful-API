[database]
; Database connection settings for Docker development
; For local XAMPP, update host to 127.0.0.1 and username to root
host = 127.0.0.1
port = 3306
database = f1_db
username = root
password = f1_password
charset = utf8mb4
collation = utf8mb4_general_ci
driver = mysql

[app]
; Application settings
name = F1 Management API
env = development
debug = true

[logging]
; Logging configuration
level = debug
path = logs/app.log
channel = app
