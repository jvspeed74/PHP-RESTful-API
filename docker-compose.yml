services:
  php-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: f1_api_app
    ports:
      - "8080:8080"
    volumes:
      - .:/var/www/html
      - ./logs:/var/www/html/logs
      - /var/www/html/vendor
    environment:
      - DATABASE_HOST=mariadb
      - DATABASE_PORT=3306
      - DATABASE_DATABASE=f1_db
      - DATABASE_USERNAME=f1_user
      - DATABASE_PASSWORD=f1_password
      - APP_ENV=development
      - PHP_IDE_CONFIG=serverName=localhost
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - f1_network
    command: /bin/bash /docker-entrypoint.sh

  mariadb:
    image: mariadb:11.4
    container_name: f1_api_db
    ports:
      - "3306:3306"
    environment:
      MARIADB_ALLOW_EMPTY_PASSWORD: "yes"
      MARIADB_DATABASE: f1_db
      MARIADB_USER: f1_user
      MARIADB_PASSWORD: f1_password
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
    volumes:
      - f1_db_data:/var/lib/mysql
      - ./f1_db.sql:/docker-entrypoint-initdb.d/f1_db.sql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - f1_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: f1_api_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mariadb
      PMA_USER: f1_user
      PMA_PASSWORD: f1_password
      PMA_PORT: 3306
    depends_on:
      - mariadb
    networks:
      - f1_network

volumes:
  f1_db_data:

networks:
  f1_network:
    driver: bridge
